# ========================================
# Configuration du Projet Metro 2025
# ========================================

[Fichiers]
# Chemin vers le fichier contenant les stations
# Format: longitude ; latitude ; nom_station
fichier_stations = stations.csv

# Chemin vers le fichier contenant les lignes de metro
# Format: code ; vitesse ; intervalle ; couleur
fichier_lignes = lignes.csv

# Chemin vers le fichier contenant les connexions
# Format: code_ligne ; station_depart ; station_arrivée ; temps
fichier_connexions = connexions.csv

[Parametres]
# Temps moyen de correspondance entre deux lignes (en minutes)
temps_correspondance = 3.0
# Temps d'arrêt moyen en station (en minutes)
temps_arret = 0.5
